services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextfarm_supportops
      POSTGRES_USER: nextfarm
      POSTGRES_PASSWORD: nextfarm_demo
    ports:
      - "5432:5432"
    volumes:
      - nextfarm_pg:/var/lib/postgresql/data
      - ./infra/database/nextfarm_supportops_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infra/database/seed_anh_long.sql:/docker-entrypoint-initdb.d/02_seed_anh_long.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextfarm -d nextfarm_supportops"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextfarm:nextfarm_demo@postgres:5432/nextfarm_supportops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8100:8000"

  knowledge-service:
    build:
      context: .
      dockerfile: services/knowledge-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextfarm:nextfarm_demo@postgres:5432/nextfarm_supportops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8200:8000"

  farm-data-service:
    build:
      context: .
      dockerfile: services/farm-data-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextfarm:nextfarm_demo@postgres:5432/nextfarm_supportops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8300:8000"

  sales-service:
    build:
      context: .
      dockerfile: services/sales-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextfarm:nextfarm_demo@postgres:5432/nextfarm_supportops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8400:8000"

  ticket-service:
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextfarm:nextfarm_demo@postgres:5432/nextfarm_supportops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8500:8000"

  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot-service/Dockerfile
    environment:
      IDENTITY_URL: http://identity-service:8000
      KNOWLEDGE_URL: http://knowledge-service:8000
      FARM_DATA_URL: http://farm-data-service:8000
      SALES_URL: http://sales-service:8000
      TICKET_URL: http://ticket-service:8000
    depends_on:
      - identity-service
      - knowledge-service
      - farm-data-service
      - sales-service
      - ticket-service
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - chatbot-service

volumes:
  nextfarm_pg:
