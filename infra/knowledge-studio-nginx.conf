server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/identity/ { proxy_pass http://identity-service:8000/; proxy_set_header Host $host; }
  location /api/knowledge/ { proxy_pass http://knowledge-service:8000/; proxy_set_header Host $host; client_max_body_size 10m; }
  location / { try_files $uri $uri/ /index.html; }
}
