server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/identity/ {
    proxy_pass http://identity-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }


  location /api/farm/ {
    proxy_pass http://farm-data-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
  }

  location /api/chatbot/ {
    proxy_pass http://chatbot-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
  }

  location /api/tickets/ { return 410; }

  location /api/analytics/ {
    proxy_pass http://ai-analytics-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  location = /api/simulator/health {
    proxy_pass http://data-simulator-service:8000/health;
    proxy_set_header Host $host;
  }

  location = /api/telemetry/health {
    proxy_pass http://telemetry-ingestion-service:8000/health;
    proxy_set_header Host $host;
  }

  location /api/knowledge/ {
    proxy_pass http://knowledge-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  location /api/router/ { proxy_pass http://crop-router-service:8000/; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
