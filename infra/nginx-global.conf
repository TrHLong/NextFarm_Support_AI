limit_req_zone $binary_remote_addr zone=nextfarm_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nextfarm_chat:10m rate=5r/s;

log_format nextfarm_json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
  '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
access_log /var/log/nginx/access.log nextfarm_json;
